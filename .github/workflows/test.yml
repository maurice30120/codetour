name: Test

on:
  push:
  pull_request:
  # A manual lane for machine-specific investigations, e.g. a Windows path
  # spelling. It never runs on a push or a pull request.
  workflow_dispatch:
    inputs:
      diagnose:
        description: Investigation to run instead of the test matrix
        type: choice
        default: run-log
        options:
          - run-log

permissions:
  contents: read

jobs:
  test:
    # Pull requests test the merge result; pushes test only the default branch.
    # This avoids duplicate feature-branch runs while retaining post-merge CI.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        suite: [compiled, renderer, knowledge, mcp-server, scripts, exploration, package, standalone]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned npm
        run: npm install --global npm@12.0.1
        working-directory: ${{ runner.temp }}
      - name: Verify toolchain
        run: node --version && npm --version
      - run: npm ci
      - run: npm ci --prefix packages/description-renderer
      - run: npm ci --prefix packages/knowledge
      # npm packs file: dependencies at install time; build knowledge first.
      - run: npm run build --prefix packages/knowledge
      - run: npm ci --prefix packages/mcp-server
      - run: npm ci --prefix packages/exploration-poc
      - run: npm ci --prefix packages/exploration-sandbox
      - name: Build application
        if: contains(fromJSON('["compiled", "mcp-server", "scripts", "standalone"]'), matrix.suite)
        run: npm run build
      - name: Sync renderer dependency
        if: matrix.suite == 'compiled' || matrix.suite == 'scripts'
        run: node scripts/sync-renderer-dep.js
      - name: Compiled tests
        if: matrix.suite == 'compiled'
        run: npx tsc -p tsconfig.test.json && node scripts/run-compiled-tests.js dist/test
      - name: Renderer tests
        if: matrix.suite == 'renderer'
        run: npm test --prefix packages/description-renderer
      - name: Knowledge tests
        if: matrix.suite == 'knowledge'
        run: npm test --prefix packages/knowledge
      - name: MCP server tests
        if: matrix.suite == 'mcp-server'
        run: npm test --prefix packages/mcp-server
      - name: Script tests
        if: matrix.suite == 'scripts'
        run: node --test test/copilot-adapter.test.mjs test/copilot-hook.test.mjs test/copilot-plugin-install.test.mjs test/pi-guard.test.mjs test/pi-plugin-install.test.mjs test/pi-extension.test.mjs test/cli-resolution.test.mjs test/pre-commit-hook.test.mjs test/knowledge-cli.test.mjs
      - name: Exploration tests
        if: matrix.suite == 'exploration'
        run: npm test --prefix packages/exploration-poc
      - name: Package extension
        if: matrix.suite == 'package'
        run: npm run package
      - name: Test standalone distribution
        if: matrix.suite == 'standalone'
        run: npm run test:standalone

  diagnose-run-log:
    # A permanent, on-demand investigation lane: it replays the run-log contract
    # end to end and prints every spelling of the workspace, so a machine-specific
    # mismatch (8.3 short paths, mapped drives, symlinked checkouts) is read
    # instead of guessed. It costs nothing on ordinary runs.
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose == 'run-log'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned npm
        run: npm install --global npm@12.0.1
        working-directory: ${{ runner.temp }}
      - name: Verify toolchain
        run: node --version && npm --version
      - run: npm ci
      # The server's build reads both local packages, and npm packs them at
      # install time: their dist must exist before the server installs them.
      - run: npm ci --prefix packages/description-renderer
      - run: npm ci --prefix packages/knowledge
      - run: npm run build --prefix packages/description-renderer
      - run: npm run build --prefix packages/knowledge
      - run: npm ci --prefix packages/mcp-server
      # The run-log writer is read from the built server; the packaging step is
      # skipped because it stages the renderer payload this lane never uses.
      - run: npx tsc -p packages/mcp-server/tsconfig.json
      - name: Replay the run-log contract
        run: node scripts/diagnose-run-log.mjs
