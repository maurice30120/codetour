name: Resolve TermDOM lockfile (temporary)
on:
  push:
    branches: [feature/spec-71-ticket-03]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.0.1
      - run: npm install --package-lock-only --ignore-scripts
      - name: Emit resolved lockfile
        run: node -e "const fs=require('node:fs');const s=fs.readFileSync('package-lock.json').toString('base64');for(let i=0;i<s.length;i+=4000)console.log('SPEC71LOCK='+s.slice(i,i+4000));"
