name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json
            packages/description-renderer/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/mcp-server
      - run: npm ci --prefix packages/description-renderer
      - run: npm test
      - run: npm run package
      - name: Verify the VSIX contains the compiled MCP server
        shell: bash
        run: unzip -l codetour-*.vsix | grep 'extension/dist/mcp-server.js'
      - name: Verify the VSIX contains no web extension artifact
        shell: bash
        run: "! unzip -l codetour-*.vsix | grep 'extension-web'"
