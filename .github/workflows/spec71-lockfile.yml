name: Regenerate Spec71 TermDOM lockfile
'on':
  push:
    branches:
      - feature/spec-71-ticket-03
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.event.head_commit.message != 'chore(spec71): regenerate TermDOM lockfile' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.0.1
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit exact resolved dependency lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='codetour-ci' -c user.email='ci@users.noreply.github.com' commit -m 'chore(spec71): regenerate TermDOM lockfile'
          git push
