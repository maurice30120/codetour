name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing GitHub release tag to build and attach VSIX files to
        required: true
        type: string

permissions:
  contents: write

jobs:
  Release:
    # Standard hosted runners are free only while the repository is public.
    if: github.event.repository.private == false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned npm
        run: npm install --global npm@12.0.1
        working-directory: ${{ runner.temp }}
      - name: Verify toolchain
        run: node --version && npm --version
      - run: npm ci
      - run: npm ci --prefix packages/description-renderer
      - run: npm ci --prefix packages/mcp-server
      - name: Package platform VSIX
        run: npm run package
      - name: Attach platform VSIX to GitHub release
        shell: bash
        run: gh release upload --clobber -- "$RELEASE_TAG" codetour-*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Publish to VS Marketplace when configured
        if: github.event_name == 'release'
        shell: bash
        run: |
          if [[ -n "$VSCE_PAT" ]]; then
            vsix=(codetour-*.vsix)
            node_modules/.bin/vsce publish --packagePath "${vsix[0]}"
          else
            echo "VSCE_PAT is not configured; " \
              "download the VSIX from the GitHub release."
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
